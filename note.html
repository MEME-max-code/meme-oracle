<body><div class="top-art" aria-hidden="true"></div><header><a href="#home" class="brand">meme atelier <span>／ 意識で描く、私の毎日</span></a><button class="settings-button" data-route="settings" aria-label="設定を開く">設定</button></header><main id="app"></main><div id="status" role="status" aria-live="polite"></div><nav aria-label="メインメニュー"><a href="#home">⌂<span>ホーム</span></a><a href="#future">◇<span>未来の設定</span></a><a href="#morning">☀<span>朝</span></a><a href="#night">☾<span>夜</span></a><a href="#diary">▤<span>足あと</span></a></nav><noscript>このノートにはJavaScriptが必要です。ブラウザの設定で有効にしてください。</noscript><script>/* Standalone data layer. Old keys are read only, never changed. */
(function(root){
 'use strict';
 const KEY='meme-oracle-footsteps-v3', RECOVERY=KEY+'-previous';
 const OLD_NOTES='meme-oracle-footsteps-v1', OLD_DAILY='meme-oracle-daily-v1';
 const fields=['wishes','gratitude','intention','praise','received','insight','nightGratitude','nightPraise'];
 const periods=['best','ten','five','one','sixMonths','threeMonths','oneMonth'];
 const clone=x=>JSON.parse(JSON.stringify(x));
 const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36);};

 function empty(){return {version:3,settings:{name:'',affirmation:'',ritual:'叶いました。ありがとうございます。'},future:Object.fromEntries(periods.map(k=>[k,''])),days:{},legacyNotes:[],legacySources:[],importedProfiles:[],drafts:{}};}
 function day(){return Object.assign(Object.fromEntries(fields.map(k=>[k,[]])),{comment:'',ritual:null});}
 function validNote(x){return x&&typeof x.id==='string'&&typeof x.text==='string'&&typeof x.createdAt==='string'&&(x.doneAt===null||typeof x.doneAt==='string');}
 function validDaily(x){return x&&dateOK(x.date)&&typeof x.gratitude==='string'&&typeof x.selfPraise==='string';}
 function validate(s){
  if(!s||s.version!==3||!s.settings||!s.future||!s.days||Array.isArray(s.days))throw Error('完全版の形式を確認できません。');
  for(const k of ['name','affirmation','ritual'])if(typeof s.settings[k]!=='string')throw Error('設定の形式が違います。');
  for(const k of periods)if(typeof s.future[k]!=='string')throw Error('未来の形式が違います。');
  for(const [date,d] of Object.entries(s.days)){
   if(!dateOK(date)||!d||typeof d.comment!=='string')throw Error('日記の日付・本文が不正です。');
   for(const k of fields){if(!Array.isArray(d[k]))throw Error('ワークの形式が違います。');const ids=new Set();for(const e of d[k]){if(!e||typeof e.id!=='string'||typeof e.text!=='string'||ids.has(e.id))throw Error('記録の形式が違います。');ids.add(e.id);if(e.status!==undefined&&!['fulfilled','waiting',''].includes(e.status))throw Error('振り返りの形式が違います。');}}

function future(){return header(owner()+'の未来の設定','毎日書き直す必要はありません。未来が変わったら、いつでも。')+`<form id="futureForm">${Object.entries(futureNames).map(([k,label])=>{const input=`<label for="future-${k}">${esc(k==='best'?owner()+'にとって最高の未来':label)}</label><textarea id="future-${k}" data-draft="future:${k}">${esc(store.state.drafts['future:'+k]??store.state.future[k])}</textarea>`;return k==='best'?`<section class="panel">${input}<p class="hint">ホームにいつも表示されます。</p></section>`:`<details class="panel"><summary>${label}</summary>${input}</details>`;}).join('')}<button class="primary" type="submit">未来を保存する</button><span class="hint">　変更はこのボタンで確定します。</span></form>${legacyArchive()}`;}
function legacyArchive(){if(!store.state.legacyNotes.length)return '';return `<details class="panel"><summary>これまで描いた未来（${store.state.legacyNotes.length}件）</summary><p class="hint">旧版の記録を、叶った日も含めてそのまま保管しています。</p>${store.state.legacyNotes.map(n=>`<article class="archive"><small>${esc(n.createdAt)}${n.doneAt?' ／ 叶った日：'+esc(n.doneAt):''}</small><p class="text">${esc(n.text)}</p></article>`).join('')}</details>`;}
function work(k){const d=getDay(),title=k==='wishes'?owner()+'のささやかな願い':names[k];return `<section class="panel" id="section-${k}"><div class="work-heading">${k==='insight'?cosmos:''}<h2>${esc(title)}</h2></div><p class="hint">${esc(hints[k])}</p>${d[k].length?`<ol>${d[k].map(e=>`<li class="entry">${editing?.id===e.id&&editing?.field===k?`<form class="edit-form" data-field="${k}" data-id="${esc(e.id)}"><label for="editText">記録を編集</label><textarea id="editText" data-draft="${esc(draftKey('edit:'+k+':'+e.id))}">${esc(store.state.drafts[draftKey('edit:'+k+':'+e.id)]??e.text)}</textarea><div class="row"><button class="primary" type="submit">変更を保存</button><button type="button" data-action="cancel-edit">閉じる</button></div></form>`:`<p class="text">${esc(e.text)}</p><div class="actions"><button class="subtle" data-action="edit" data-field="${k}" data-id="${esc(e.id)}">編集</button><button class="subtle danger" data-action="delete" data-field="${k}" data-id="${esc(e.id)}">削除</button></div>`}</li>`).join('')}</ol>`:''}<form class="add-form" data-field="${k}"><label for="add-${k}">ひとつ書き留める</label><textarea id="add-${k}" data-draft="${draftKey(k)}" placeholder="あなたの言葉で、自由に。">${esc(store.state.drafts[draftKey(k)]||'')}</textarea><button class="primary" type="submit">＋ 追加する</button></form></section>`;}
function morning(){return header('朝のワーク','今日の私に、小さな種をまく。書きたいところからどうぞ。')+datebar()+['wishes','gratitude','intention','praise'].map(work).join('')+`<div class="journal-actions"><a class="button primary" href="#home">ホームに戻る</a><a class="button" href="#diary">この日の日記を読む ›</a></div>`;}
function night(){const d=getDay();return header('夜のワーク','今日の贈りものを、ゆっくり受け取る。')+datebar()+`<section class="panel"><h2>朝のささやかな願いの振り返り</h2>${d.wishes.length?d.wishes.map(e=>`<div class="review"><p class="text">${esc(e.text)}</p><label class="hint" for="review-${esc(e.id)}">この願いの振り返り</label><select id="review-${esc(e.id)}" data-review="${esc(e.id)}"><option value="" ${!e.status?'selected':''}>今はそのまま</option><option value="fulfilled" ${e.status==='fulfilled'?'selected':''}>叶った、ありがとう</option><option value="waiting" ${e.status==='waiting'?'selected':''}>これからのお楽しみ</option></select></div>`).join(''):`<p class="quiet">願いを書いていない日も、そのまま夜のワークへ。</p><a href="#morning">ささやかな願いを書く ›</a>`}</section>`+['received','insight','nightGratitude','nightPraise'].map(work).join('')+`<section class="panel ritual"><h2>叶った感謝の儀式</h2><p class="hint">最高の未来を読み返して、叶った未来へありがとう。</p><p class="text">${esc(store.state.future.best||'未来の設定で、最高の未来を描いてみましょう。')}</p><p class="words text">${esc(store.state.settings.ritual)}</p><button class="primary" data-action="ritual">${d.ritual?'もう一度、感謝を記録する':'感謝のひとときを記録する'}</button>${d.ritual?'<p class="inline-saved">この日に感謝のひとときを記録しました。</p>':''}<p><a href="#settings">儀式の言葉を変える ›</a></p></section><div class="journal-actions"><a class="button primary" href="#home">ホームに戻る</a><a class="button" href="#diary">この日の日記を読む ›</a></div>`;}
function calendar(){const [y,m]=month.split('-').map(Number),offset=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate();return `<div class="calendar-head"><button data-action="prev-month" aria-label="前の月">‹</button><h2>${y}年${m}月</h2><button data-action="next-month" aria-label="次の月">›</button></div><div class="calendar" role="group" aria-label="日付を選ぶ">${['日','月','火','水','木','金','土'].map(x=>`<span class="weekday">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),mark=hasRecords(store.state.days[date]);return `<button data-date="${date}" class="${date===selected?'selected ':''}${date===today()?'today ':''}${mark?'mark':''}" aria-pressed="${date===selected}" aria-label="${dateLabel(date)}${mark?'、記録あり':''}">${i+1}</button>`;}).join('')}</div><p class="hint">小さな金色の印は、記録のある日。</p>`;}
function journal(){const d=getDay();let text='';for(const k of F.fields){if(!d[k].length)continue;text+=`<h3>${esc(names[k])}</h3>${d[k].map(e=>`<p class="text">${esc(e.text)}</p>${k==='wishes'&&e.status?`<p class="badge">${e.status==='fulfilled'?'叶った、ありがとう':'これからのお楽しみ'}</p>`:''}`).join('')}`;}if(d.ritual)text+=`<h3>叶った感謝の儀式</h3><p class="text">${esc(d.ritual.future)}</p><p class="text">${esc(d.ritual.text)}</p>`;return text||'<p class="quiet">この日は、まだ白いページ。<br>何も書かない日も、大切な一日です。</p>';}
function diary(){return header(owner()+'の足あと日記','朝から夜まで。あなたの言葉を、そのままに。')+`<section class="panel">${calendar()}<div class="datebar"><label for="diaryDate">日付を指定</label><input id="diaryDate" type="date" value="${selected}" required><button data-action="today">今日へ</button></div></section><article class="panel journal"><h2>${dateLabel(selected)}</h2>${journal()}${importedDayNotes()}<h3>今日のひとこと</h3>${getDay().comment?`<p class="text">${esc(getDay().comment)}</p>`:''}<form id="commentForm"><label for="comment">自由に書き留める・編集する</label><textarea id="comment" data-draft="${draftKey('comment')}">${esc(store.state.drafts[draftKey('comment')]??getDay().comment)}</textarea><button class="primary" type="submit">ひとことを保存する</button></form></article><div class="journal-actions"><button data-route="morning">この日の朝を編集</button><button data-route="night">この日の夜を編集</button></div>`;}
function importedDayNotes(){return store.state.importedProfiles.filter(p=>p.date===selected).map(p=>`<h3>復元した別の記録</h3>${p.comment?`<p class="text">${esc(p.comment)}</p>`:''}${p.ritual?`<p class="text">${esc(p.ritual.future)}</p><p class="text">${esc(p.ritual.text)}</p>`:''}`).join('');}
function settings(){return header('設定と大切な記録','自分らしい言葉で、このノートを育てましょう。')+`<form id="settingsForm" class="panel"><label for="name">名前・ニックネーム</label><input id="name" type="text" autocomplete="nickname" data-draft="settings:name" value="${esc(store.state.drafts['settings:name']??store.state.settings.name)}" placeholder="未設定なら「私」と表示します"><label for="affirmation">いつも意識していたい言葉</label><textarea id="affirmation" data-draft="settings:affirmation">${esc(store.state.drafts['settings:affirmation']??store.state.settings.affirmation)}</textarea><label for="ritual">叶った感謝の儀式の言葉</label><textarea id="ritual" data-draft="settings:ritual">${esc(store.state.drafts['settings:ritual']??store.state.settings.ritual)}</textarea><button class="primary" type="submit">設定を保存する</button></form><section class="panel"><h2>大切な記録のバックアップ</h2><p>記録は、この端末・このブラウザ内に保存されます。クラウドへの自動同期はありません。</p><p class="hint">ブラウザのデータ消去、プライベートモード、端末の故障で記録を失うことがあります。ときどきファイルに保存してください。</p><button class="primary" data-action="backup">全記録をファイルに保存</button><label for="restore">バックアップから追加・復元する</label><input class="file" id="restore" type="file" accept=".json,application/json"><p class="hint">旧版・完全版のJSONに対応。内容を確認してから取り込みます。同じ日でも、違う記録は両方残します。</p><details><summary>機種変更・別のブラウザへ</summary><p>① 今まで使っていた端末・ブラウザで「全記録をファイルに保存」を押します。ダウンロード完了を確認し、ファイルを「ファイル」アプリや安全な保存先へ保管してください。</p><p>② 新しい端末・ブラウザでアプリを開き、この画面のファイル選択から保存したJSONを選びます。</p><p>③ 内容を確認して「追加して復元」を押し、日記と未来が表示されることを確認します。</p><p>別のURLで開く試作版には記録は自動では移りません。SafariとBrave、ホーム画面から開くアプリも保存領域が分かれることがあります。</p></details><details><summary>保存に問題があるとき</summary><p>旧データは変更せず保管しています。直前の完全版データも同じブラウザ内に残します。これは端末故障へのバックアップにはなりません。</p><div class="row"><button data-action="raw-backup">元データをそのまま書き出す</button><button data-action="recover">直前の保存を確認・復元</button></div></details></section><section class="panel"><h2>iPhoneで使うには</h2><p>Safariでアプリを開き、共有ボタン（四角から上向き矢印）→「ホーム画面に追加」。いつも同じ入口から使ってください。</p><p class="hint">音声入力は、各入力欄をタップしてiPhoneキーボードのマイクから。誤変換を確認してから「追加する」を押します。音声入力の可否はiPhoneの設定に従います。</p><p class="hint">この版はオンラインで開く方式です。通信のない場所での起動は保証していません。</p></section>${importedArchive()}${legacyArchive()}<p class="copyright">© meme atelier ／ 完全版 3.0</p>`;}
function importedArchive(){if(!store.state.importedProfiles.length)return '';return `<details class="panel"><summary>復元時に保管した設定・別の内容</summary><p class="hint">現在の設定とは違う言葉も、ここにすべて残しています。必要な文章をコピーして設定できます。</p>${store.state.importedProfiles.map(p=>`<div class="archive">${p.date?`<small>${esc(p.date)}</small>`:''}${p.settings?Object.entries(p.settings).map(([k,v])=>`<p class="text">${esc({name:'名前',affirmation:'意識していたい言葉',ritual:'儀式の言葉'}[k])}：${esc(v)}</p>`).join(''):''}${p.future?Object.entries(p.future).map(([k,v])=>v?`<p class="text">${esc(futureNames[k]||k)}：${esc(v)}</p>`:'').join(''):''}${p.comment?`<p class="text">今日のひとこと：${esc(p.comment)}</p>`:''}${p.ritual?`<p class="text">${esc(p.ritual.future)}\n${esc(p.ritual.text)}</p>`:''}${p.draftKey?`<p class="text">下書き（${esc(p.draftKey)}）：${esc(p.text)}</p>`:''}</div>`).join('')}</details>`;}
function render(){route=location.hash.slice(1)||'home';if(!['home','future','morning','night','diary','settings'].includes(route))route='home';app.innerHTML=(store.error?`<div class="error">${esc(store.error)}<br><a href="#settings">元データの書き出しへ</a></div>`:'')+({home,future,morning,night,diary,settings}[route])();document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=({home:'最高の足あとノート',future:'未来の設定',morning:'朝のワーク',night:'夜のワーク',diary:'足あと日記',settings:'設定'}[route])+' | 最高の足あとノート';}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function backup(){if(store.error){try{download({format:'meme-footsteps-raw-rescue',exportedAt:new Date().toISOString(),storage:store.rawBackup()},'footsteps-original-data-'+today()+'.json');toast('読み込みに問題があるため、元データを救出用ファイルに保存しました。');}catch(e){toast('ブラウザの保存領域を読み出せません。通常モードで開いてください。');}return;}const data=store.backup();document.querySelectorAll('[data-draft]').forEach(el=>{data.state.drafts[el.dataset.draft]=el.value;});download(data,`footsteps-backup-${today()}.json`);toast('保存用ファイルを作りました。ダウンロード完了をご確認ください。');}
function dialog(html){document.querySelector('dialog')?.remove();const el=document.createElement('dialog');el.innerHTML=html;document.body.append(el);el.showModal();return el;}
function previewImport(data,label){pendingImport=data;const count=Object.values(data.days).reduce((n,d)=>n+F.fields.reduce((a,k)=>a+d[k].length,0),0);dialog(`<h2>${esc(label)}</h2><p>${Object.keys(data.days).length}日分の記録、${count}件のワーク、旧版の未来${data.legacyNotes.length}件。</p><p class="text">${esc(data.future.best)}</p><p class="notice">今ある記録を残して追加します。異なる設定やひとことも保管します。取り込み前に現在の記録をファイルに保存してください。</p><div class="row"><button data-action="backup">現在の記録を保存</button><button class="primary" data-action="confirm-import">追加して復元</button><button data-action="close-dialog">閉じる</button></div>`);}
app.addEventListener('input',e=>{if(e.target.dataset.draft)saveDraft(e.target.dataset.draft,e.target.value);});
app.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target;
 if(form.classList.contains('add-form')){const k=form.dataset.field,text=form.querySelector('textarea').value;if(!text.trim())return; if(update(s=>{const d=s.days[selected]||=F.day();d[k].push({id:uid(),text});delete s.drafts[draftKey(k)];},true))toast('書き留めました。');}
 else if(form.classList.contains('edit-form')){const k=form.dataset.field,id=form.dataset.id,text=form.querySelector('textarea').value;if(!text.trim()){toast('空にする場合は「削除」を使ってください。');return;}if(update(s=>{s.days[selected][k].find(x=>x.id===id).text=text;delete s.drafts[draftKey('edit:'+k+':'+id)];})){editing=null;render();toast('変更を保存しました。');}}
 else if(form.id==='futureForm'){const values=Object.fromEntries(F.periods.map(k=>[k,$('#future-'+k).value]));if(update(s=>{s.future=values;F.periods.forEach(k=>delete s.drafts['future:'+k]);},true))toast('未来を保存しました。');}
 else if(form.id==='settingsForm'){const values=Object.fromEntries(['name','affirmation','ritual'].map(k=>[k,$('#'+k).value]));if(update(s=>{s.settings=values;Object.keys(values).forEach(k=>delete s.drafts['settings:'+k]);},true))toast('設定を保存しました。');}
 else if(form.id==='commentForm'){const text=$('#comment').value;if(update(s=>{(s.days[selected]||=F.day()).comment=text;delete s.drafts[draftKey('comment')];},true))toast('ひとことを保存しました。');}
});
app.addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='workDate'||el.id==='diaryDate'){if(!F.dateOK(el.value)){el.value=selected;return;}if(unsaved){toast('保存できていない入力があります。先にバックアップしてください。');el.value=selected;return;}selected=el.value;month=selected.slice(0,7);editing=null;render();}
 if(el.dataset.review){const id=el.dataset.review,status=el.value;if(update(s=>{s.days[selected].wishes.find(x=>x.id===id).status=status;}))toast('振り返りを保存しました。');else render();}
 if(el.id==='restore'){const file=el.files[0];if(!file)return;try{const data=F.decode(JSON.parse(await file.text()));previewImport(data,'バックアップの内容を確認');}catch(err){toast(err.message);}finally{el.value='';}}
});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action],[data-route],[data-date]');if(!el)return;
 if(el.dataset.route){location.hash=el.dataset.route;return;}
 if(el.dataset.date){if(unsaved){toast('保存できていない入力があります。先にバックアップしてください。');return;}selected=el.dataset.date;editing=null;render();return;}
 const act=el.dataset.action,k=el.dataset.field,id=el.dataset.id;
 if(act==='today'){if(unsaved){toast('先に入力をバックアップしてください。');return;}selected=today();month=selected.slice(0,7);editing=null;render();}
 if(act==='prev-month'||act==='next-month'){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+(act==='next-month'?1:-1),1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}
 if(act==='edit'){editing={field:k,id};render();$('#editText')?.focus();}
 if(act==='cancel-edit'){editing=null;render();}
 if(act==='delete'){const entry=getDay()[k].find(x=>x.id===id);dialog(`<h2>この記録を削除しますか？</h2><p class="text">${esc(entry.text)}</p><p class="hint">削除直前の保存内容は設定から復元できます。</p><div class="row"><button class="danger" data-action="confirm-delete" data-field="${k}" data-id="${esc(id)}">削除する</button><button data-action="close-dialog">残す</button></div>`);}
 if(act==='confirm-delete'){if(update(s=>{s.days[selected][k]=s.days[selected][k].filter(x=>x.id!==id);delete s.drafts[draftKey('edit:'+k+':'+id)];},true)){document.querySelector('dialog')?.close();toast('削除しました。');}}
 if(act==='ritual'){if(update(s=>{(s.days[selected]||=F.day()).ritual={text:s.settings.ritual,future:s.future.best,at:new Date().toISOString()};},true))toast('感謝のひとときを書き留めました。');}
 if(act==='backup')backup();
 if(act==='raw-backup'){try{download({format:'meme-footsteps-raw-rescue',exportedAt:new Date().toISOString(),storage:store.rawBackup()},'footsteps-original-data-'+today()+'.json');toast('元データをファイルに書き出しました。');}catch(err){toast(err.message);}}
 if(act==='recover'){try{const raw=store.storage.getItem(F.RECOVERY);if(!raw)throw Error('直前の保存はまだありません。');previewImport(F.decode(JSON.parse(raw)),'直前の保存を確認');}catch(err){toast(err.message);}}
 if(act==='confirm-import'&&pendingImport){if(update(s=>{const merged=F.merge(s,pendingImport);Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,merged);},true)){pendingImport=null;document.querySelector('dialog')?.close();toast('今ある記録を残して復元しました。');}}
 if(act==='close-dialog'){document.querySelector('dialog')?.close();pendingImport=null;}
});
window.addEventListener('hashchange',()=>{editing=null;render();window.scrollTo(0,0);});
window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===F.KEY&&e.newValue!==store.lastRaw){unsaved=true;toast('別の画面で記録が更新されました。入力をバックアップして再読み込みしてください。');}});
render();
</script></body></html>
